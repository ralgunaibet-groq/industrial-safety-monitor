<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Safety Monitor - Vercel Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        .upload-section {
            text-align: center;
            padding: 40px;
            border: 3px dashed #ddd;
            border-radius: 8px;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        
        .upload-section.dragover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        
        .preview-image {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin: 20px 0;
        }
        
        .results {
            margin-top: 20px;
        }
        
        .severity-badge {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            margin: 10px 0;
        }
        
        .severity-none, .severity-low {
            background: #d4edda;
            color: #155724;
        }
        
        .severity-medium {
            background: #fff3cd;
            color: #856404;
        }
        
        .severity-high {
            background: #f8d7da;
            color: #721c24;
        }
        
        .severity-critical {
            background: #f8d7da;
            color: #721c24;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .hazard-list, .recommendations-list {
            list-style: none;
            margin-top: 10px;
        }
        
        .hazard-list li, .recommendations-list li {
            padding: 10px;
            margin: 5px 0;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 4px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏭 Industrial Safety Monitor</h1>
            <p>AI-Powered Image Analysis for Safety Hazards</p>
        </div>
        
        <div class="card">
            <div class="input-group">
                <label for="apiKey">Groq API Key</label>
                <input type="password" id="apiKey" placeholder="Enter your Groq API key">
                <small style="color: #666;">Get your API key from <a href="https://console.groq.com" target="_blank">console.groq.com</a></small>
            </div>
            
            <div class="upload-section" id="uploadSection">
                <h3>📸 Upload or Drop an Image</h3>
                <p style="margin: 10px 0; color: #666;">Click to select or drag and drop an image</p>
                <input type="file" id="fileInput" accept="image/*">
                <button class="btn" onclick="document.getElementById('fileInput').click()">Choose Image</button>
            </div>
            
            <div id="preview"></div>
            
            <button class="btn" id="analyzeBtn" onclick="analyzeImage()" disabled>Analyze Image</button>
        </div>
        
        <div id="resultsCard" class="card" style="display: none;">
            <h2>📊 Analysis Results</h2>
            <div id="results"></div>
        </div>
    </div>
    
    <script>
        let selectedImage = null;
        
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultsCard = document.getElementById('resultsCard');
        const results = document.getElementById('results');
        
        // File input change
        fileInput.addEventListener('change', handleFileSelect);
        
        // Drag and drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('dragover');
        });
        
        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('dragover');
        });
        
        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('dragover');
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });
        
        function handleFileSelect(e) {
            const files = e.target.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        }
        
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert('Please select an image file');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = (e) => {
                selectedImage = e.target.result;
                preview.innerHTML = `<img src="${selectedImage}" class="preview-image" alt="Preview">`;
                analyzeBtn.disabled = false;
            };
            reader.readAsDataURL(file);
        }
        
        async function analyzeImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            
            if (!apiKey) {
                alert('Please enter your Groq API key');
                return;
            }
            
            if (!selectedImage) {
                alert('Please select an image first');
                return;
            }
            
            // Show loading
            results.innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing image...</p></div>';
            resultsCard.style.display = 'block';
            analyzeBtn.disabled = true;
            
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        api_key: apiKey,
                        image: selectedImage
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResults(data.data);
                } else {
                    results.innerHTML = `<div class="error">Error: ${data.error}</div>`;
                }
            } catch (error) {
                results.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                analyzeBtn.disabled = false;
            }
        }
        
        function displayResults(data) {
            const severityClass = `severity-${data.severity}`;
            
            let hazardsList = '';
            if (data.hazard_types && data.hazard_types.length > 0) {
                hazardsList = '<ul class="hazard-list">' + 
                    data.hazard_types.map(h => `<li>${h}</li>`).join('') + 
                    '</ul>';
            }
            
            let recommendationsList = '';
            if (data.recommended_actions && data.recommended_actions.length > 0) {
                recommendationsList = '<ul class="recommendations-list">' + 
                    data.recommended_actions.map(r => `<li>${r}</li>`).join('') + 
                    '</ul>';
            }
            
            results.innerHTML = `
                <div>
                    <h3>Hazard Status: ${data.hazard_present ? '⚠️ Hazard Detected' : '✅ Safe'}</h3>
                    <div class="severity-badge ${severityClass}">
                        Severity: ${data.severity.toUpperCase()}
                    </div>
                    
                    <h4 style="margin-top: 20px;">Description:</h4>
                    <p style="padding: 10px; background: #f8f9fa; border-radius: 4px;">${data.description}</p>
                    
                    ${data.hazard_types && data.hazard_types.length > 0 ? `
                        <h4 style="margin-top: 20px;">Detected Hazards:</h4>
                        ${hazardsList}
                    ` : ''}
                    
                    ${data.recommended_actions && data.recommended_actions.length > 0 ? `
                        <h4 style="margin-top: 20px;">Recommended Actions:</h4>
                        ${recommendationsList}
                    ` : ''}
                </div>
            `;
        }
    </script>
</body>
</html>
